# orm-china-relay 路 GitHub Actions relay (B-path of @local/orm-china-viewer)
# Runs on GitHub's clean network: pulls the Geofabrik China extract, filters
# railway features with osmium, publishes the filtered PBF as a Release asset
# (a few tens of MB, far below the 2 GB asset cap). The local machine then
# fetches it through api.github.com / gh-proxy, bypassing local blackholes.
name: relay
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1" # weekly, Mondays 18:17 UTC (off-peak)

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download Geofabrik China extract
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            curl -fL --retry 3 --connect-timeout 30 -o china-latest.osm.pbf \
              https://download.geofabrik.de/asia/china-latest.osm.pbf && break
            echo "attempt $i failed; sleeping"; sleep $((i * 20))
          done
          test -s china-latest.osm.pbf
          ls -l china-latest.osm.pbf
      - name: Filter railway features
        run: |
          set -euo pipefail
          osmium tags-filter china-latest.osm.pbf \
            w/railway=rail n/railway=station n/railway=halt \
            -o china-rail-latest.osm.pbf --overwrite
          osmium fileinfo -e china-rail-latest.osm.pbf | tee fileinfo.txt
          ls -l china-rail-latest.osm.pbf
      - name: Checksum + metadata
        run: |
          sha256sum china-rail-latest.osm.pbf > china-rail-latest.osm.pbf.sha256
          date -u +%Y-%m-%dT%H:%M:%SZ > generated-at.txt
          cp fileinfo.txt china-rail-latest.fileinfo.txt
      - name: Publish release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: data-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release view "data-latest" >/dev/null 2>&1 && gh release delete "data-latest" --yes || true
          gh release create "data-latest" \
            china-rail-latest.osm.pbf china-rail-latest.osm.pbf.sha256 \
            china-rail-latest.fileinfo.txt generated-at.txt \
            --title "China railway extract (rolling)" \
            --notes "Filtered from download.geofabrik.de/asia/china-latest.osm.pbf. Data (c) OpenStreetMap contributors, ODbL 1.0. Regenerated by the relay workflow; see fileinfo.txt for counts and generated-at.txt for the timestamp."
